<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 옥상 지도 🏙️</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      overflow: hidden;
      height: 100vh;
    }

    /* ── Header ── */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: white;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      box-shadow: var(--shadow);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .header-logo .emoji { font-size: 24px; }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }

    .btn-secondary {
      background: white;
      color: var(--gray-700);
      border: 1px solid var(--gray-300);
    }
    .btn-secondary:hover { background: var(--gray-50); border-color: var(--gray-400); }

    .btn-accent {
      background: var(--accent);
      color: white;
    }
    .btn-accent:hover { background: #d97706; }

    .btn-icon {
      width: 36px; height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    /* ── Map ── */
    #map {
      position: fixed;
      top: 60px;
      left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 400px;
      bottom: 0;
      background: white;
      z-index: 500;
      box-shadow: var(--shadow-xl);
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .sidebar-close {
      width: 32px; height: 32px;
      border: none;
      background: var(--gray-100);
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-500);
      transition: all 0.2s;
    }
    .sidebar-close:hover { background: var(--gray-200); color: var(--gray-800); }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* ── Detail Panel (right side) ── */
    .detail-panel {
      position: fixed;
      top: 60px;
      right: 0;
      width: 420px;
      bottom: 0;
      background: white;
      z-index: 500;
      box-shadow: var(--shadow-xl);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-panel.open { transform: translateX(0); }

    .detail-header {
      padding: 20px;
      border-bottom: 1px solid var(--gray-200);
      flex-shrink: 0;
    }

    .detail-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .detail-header h2 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }

    .detail-header .address {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 4px;
    }

    .detail-body {
      flex: 1;
      overflow-y: auto;
    }

    .detail-section {
      padding: 20px;
      border-bottom: 1px solid var(--gray-100);
    }

    .detail-section:last-child { border-bottom: none; }

    .detail-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* ── Info Grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info-card {
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      padding: 14px;
      text-align: center;
    }

    .info-card .label {
      font-size: 11px;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .info-card .value {
      font-size: 16px;
      font-weight: 600;
      color: var(--gray-800);
    }

    .info-card .value.highlight {
      color: var(--primary);
    }

    /* ── Tags ── */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .tag-blue { background: #dbeafe; color: #1e40af; }
    .tag-green { background: #d1fae5; color: #065f46; }
    .tag-amber { background: #fef3c7; color: #92400e; }
    .tag-red { background: #fee2e2; color: #991b1b; }
    .tag-purple { background: #ede9fe; color: #5b21b6; }
    .tag-gray { background: var(--gray-100); color: var(--gray-600); }

    /* ── View Description ── */
    .view-description {
      background: linear-gradient(135deg, #eff6ff, #f0f9ff);
      border-radius: var(--radius-sm);
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--gray-700);
      border-left: 3px solid var(--primary);
    }

    /* ── Comments ── */
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment {
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      padding: 14px;
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-700);
    }

    .comment-date {
      font-size: 11px;
      color: var(--gray-400);
    }

    .comment-text {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.6;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .comment-form input,
    .comment-form textarea {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      resize: none;
      transition: border-color 0.2s;
    }

    .comment-form input:focus,
    .comment-form textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .comment-input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-input-row {
      display: flex;
      gap: 8px;
    }

    .comment-input-row input {
      width: 120px;
      flex: none;
    }

    .no-comments {
      text-align: center;
      padding: 20px;
      color: var(--gray-400);
      font-size: 14px;
    }

    /* ── Report Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: white;
      border-radius: var(--radius);
      width: 90%;
      max-width: 560px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow-xl);
      transform: translateY(20px);
      transition: transform 0.3s;
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-header {
      padding: 24px 24px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .modal-header p {
      font-size: 14px;
      color: var(--gray-500);
      margin-top: 4px;
    }

    .modal-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-group label .required {
      color: var(--danger);
    }

    .form-group label .optional {
      font-weight: 400;
      color: var(--gray-400);
      font-size: 12px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group .hint {
      font-size: 12px;
      color: var(--gray-400);
      margin-top: 4px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checkbox-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      padding: 6px 12px;
      border: 1px solid var(--gray-200);
      border-radius: 20px;
      transition: all 0.2s;
    }

    .checkbox-group label:has(input:checked) {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .checkbox-group input[type="checkbox"] {
      display: none;
    }

    .modal-footer {
      padding: 0 24px 24px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* ── Location List ── */
    .location-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .location-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .location-item:hover {
      background: var(--gray-50);
      border-color: var(--gray-200);
    }

    .location-item .icon {
      width: 44px;
      height: 44px;
      background: var(--primary-light);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .location-item .info {
      flex: 1;
      min-width: 0;
    }

    .location-item .name {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-800);
      margin-bottom: 2px;
    }

    .location-item .addr {
      font-size: 12px;
      color: var(--gray-400);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-item .floor {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      flex-shrink: 0;
    }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-chip {
      padding: 6px 14px;
      border: 1px solid var(--gray-200);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: white;
      color: var(--gray-600);
      transition: all 0.2s;
    }

    .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
    .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* ── Search ── */
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      background: var(--gray-50);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .search-box .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--gray-400);
    }

    /* ── Stats Bar ── */
    .stats-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 30px;
      padding: 10px 24px;
      box-shadow: var(--shadow-lg);
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      border: 1px solid var(--gray-200);
    }

    .stats-bar .stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-bar .stat-num {
      font-weight: 700;
      color: var(--primary);
    }

    .stats-bar .divider {
      width: 1px;
      height: 20px;
      background: var(--gray-200);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--gray-800);
      color: white;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      z-index: 3000;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Custom Marker ── */
    .custom-marker {
      background: none;
      border: none;
    }

    .marker-pin {
      width: 36px;
      height: 44px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .marker-pin:hover { transform: scale(1.15); }

    .marker-pin .pin-body {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(37,99,235,0.4);
      border: 3px solid white;
    }

    .marker-pin .pin-body .pin-icon {
      transform: rotate(45deg);
      font-size: 16px;
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-400);
    }

    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .detail-panel { width: 100%; }
      .stats-bar { width: calc(100% - 40px); justify-content: center; }
      .header-logo span { display: none; }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

    /* ── Accessibility Status ── */
    .access-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .access-open { background: #d1fae5; color: #065f46; }
    .access-closed { background: #fee2e2; color: #991b1b; }
    .access-limited { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

  <!-- ══════ HEADER ══════ -->
  <header class="header">
    <div class="header-logo">
      <span class="emoji">🏙️</span>
      <span id="appTitle">서울 옥상 지도</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" id="langToggleBtn" onclick="toggleLanguage()" style="font-weight: 600;">
        🌐 English
      </button>
      <button class="btn btn-secondary" id="btnList" onclick="toggleSidebar()">
        📋 목록
      </button>
      <button class="btn btn-primary" id="btnReport" onclick="openReportModal()">
        📍 새 옥상 제보
      </button>
    </div>
  </header>

  <!-- ══════ MAP ══════ -->
  <div id="map"></div>

  <!-- ══════ SIDEBAR (Location List) ══════ -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 id="sidebarTitle">📋 옥상 목록</h2>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-body">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="건물명 또는 지역으로 검색..."
               oninput="filterLocations()">
      </div>

      <div class="filter-bar">
        <button class="filter-chip active" data-filter="all" onclick="setFilter('all', this)"><span id="chipAll">전체</span></button>
        <button class="filter-chip" data-filter="garden" onclick="setFilter('garden', this)"><span id="chipGarden">🌿 정원</span></button>
        <button class="filter-chip" data-filter="cafe" onclick="setFilter('cafe', this)"><span id="chipCafe">☕ 카페</span></button>
        <button class="filter-chip" data-filter="night" onclick="setFilter('night', this)"><span id="chipNight">🌙 야간개방</span></button>
        <button class="filter-chip" data-filter="free" onclick="setFilter('free', this)"><span id="chipFree">🆓 무료</span></button>
        <button class="filter-chip" data-filter="public" onclick="setFilter('public', this)"><span id="chipPublic">🚪 개방형</span></button>
      </div>

      <div class="location-list" id="locationList">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>

  <!-- ══════ DETAIL PANEL ══════ -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div class="detail-header-top">
        <div>
          <h2 id="detailName"></h2>
          <p class="address" id="detailAddress"></p>
        </div>
        <button class="sidebar-close" onclick="closeDetail()">✕</button>
      </div>
    </div>
    <div class="detail-body" id="detailBody">
      <!-- Dynamically populated -->
    </div>
  </div>

  <!-- ══════ REPORT MODAL ══════ -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle">📍 새 옥상 제보하기</h2>
          <p id="modalSub">아직 등록되지 않은 개방 옥상을 알려주세요!</p>
        </div>
        <button class="sidebar-close" onclick="closeReportModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label id="labelReportName">건물명 <span class="required">*</span></label>

    // ═══════════════════════════════════════════
    // MAP INITIALIZATION
    // ═══════════════════════════════════════════

    const map = L.map('map', {
      zoomControl: false
    }).setView([37.5665, 126.978], 12);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Tile layer - CartoDB Positron (clean, modern look)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // ═══════════════════════════════════════════
    // CUSTOM MARKER
    // ═══════════════════════════════════════════

    function createMarkerIcon(rooftop) {
      const icon = rooftop.features.garden ? '🌿' :
                   rooftop.features.cafe ? '☕' :
                   rooftop.features.night ? '🌙' :
                   rooftop.features.view ? '🌆' : '🏢';

      return L.divIcon({
        className: 'custom-marker',
        html: `
          <div class="marker-pin">
            <div class="pin-body">
              <span class="pin-icon">${icon}</span>
            </div>
          </div>
        `,
        iconSize: [36, 44],
        iconAnchor: [18, 44],
        popupAnchor: [0, -44]
      });
    }

    // ═══════════════════════════════════════════
    // RENDER MARKERS
    // ═══════════════════════════════════════════

    function renderMarkers() {
      // Clear existing markers
      Object.values(markers).forEach(m => map.removeLayer(m));
      markers = {};

      const filtered = getFilteredRooftops();

      filtered.forEach(rt => {
        const marker = L.marker([rt.lat, rt.lng], {
          icon: createMarkerIcon(rt)
        }).addTo(map);

        marker.on('click', () => openDetail(rt.id));

        // Localized popup tooltip
        const displayName = currentLang === 'en' ? (rt.name_en || rt.name) : rt.name;
        marker.bindTooltip(displayName, {
          direction: 'top',
          offset: [0, -48],
          className: 'custom-tooltip'
        });

        markers[rt.id] = marker;
      });

      updateStats();
    }

    // ═══════════════════════════════════════════
    // FILTERING
    // ═══════════════════════════════════════════

    function getFilteredRooftops() {
      const query = document.getElementById('searchInput')?.value?.toLowerCase().trim() || '';

      return rooftops.filter(rt => {
        // Search filter across both Korean and English fields
        const matchesSearch = !query ||
          rt.name.toLowerCase().includes(query) ||
          (rt.name_en && rt.name_en.toLowerCase().includes(query)) ||
          rt.address.toLowerCase().includes(query) ||
          (rt.address_en && rt.address_en.toLowerCase().includes(query)) ||
          (rt.view && rt.view.toLowerCase().includes(query)) ||
          (rt.view_en && rt.view_en.toLowerCase().includes(query));

        // Tag filter
        const matchesFilter = currentFilter === 'all' ||
          (currentFilter === 'cafe' && rt.features.cafe) ||
          (currentFilter === 'garden' && rt.features.garden) ||
          (currentFilter === 'night' && rt.features.night) ||
          (currentFilter === 'free' && rt.tags.includes('free')) ||
          (currentFilter === 'public' && rt.access === 'open');

        return matchesSearch && matchesFilter;
      });
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderMarkers();
      renderLocationList();
    }

    function filterLocations() {
      renderMarkers();
      renderLocationList();
    }

    // ═══════════════════════════════════════════
    // SIDEBAR (LOCATION LIST)
    // ═══════════════════════════════════════════

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('open');
      if (sb.classList.contains('open')) {
        closeDetail();
        renderLocationList();
      }
    }

    function renderLocationList() {
      const container = document.getElementById('locationList');
      const filtered = getFilteredRooftops();
      const t = i18n[currentLang];

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🔍</div>
            <p>${t.emptySearch}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(rt => {
        const name = currentLang === 'en' ? (rt.name_en || rt.name) : rt.name;
        const addr = currentLang === 'en' ? (rt.address_en || rt.address) : rt.address;
        return `
          <div class="location-item" onclick="openDetail(${rt.id})">
            <div class="icon">${rt.features.garden ? '🌿' : rt.features.cafe ? '☕' : rt.features.night ? '🌙' : rt.features.view ? '🌆' : '🏢'}</div>
            <div class="info">
              <div class="name">${name}</div>
              <div class="addr">${addr}</div>
            </div>
            <div class="floor">${rt.floor}F</div>
          </div>
        `;
      }).join('');
    }

    // ═══════════════════════════════════════════
    // DETAIL PANEL
    // ═══════════════════════════════════════════

    function openDetail(id) {
      const rt = rooftops.find(r => r.id === id);
      if (!rt) return;

      const t = i18n[currentLang];
      document.getElementById('sidebar').classList.remove('open');

      const name = currentLang === 'en' ? (rt.name_en || rt.name) : rt.name;
      const addr = currentLang === 'en' ? (rt.address_en || rt.address) : rt.address;
      const hours = currentLang === 'en' ? (rt.hours_en || rt.hours) : rt.hours;
      const fee = currentLang === 'en' ? (rt.fee_en || rt.fee) : rt.fee;
      const view = currentLang === 'en' ? (rt.view_en || rt.view) : rt.view;

      document.getElementById('detailName').textContent = name;
      document.getElementById('detailAddress').textContent = addr;

      const accessLabel = {
        'open': t.accessOpen,
        'limited': t.accessLimited,
        'tenant': t.accessTenant,
      }[rt.access] || t.accessUnknown;

      const featureTags = [];
      if (rt.features.garden)     featureTags.push(t.tagGarden);
      if (rt.features.cafe)       featureTags.push(t.tagCafe);
      if (rt.features.restaurant) featureTags.push(t.tagRestaurant);
      if (rt.features.smoking)    featureTags.push(t.tagSmoking);
      if (rt.features.bench)      featureTags.push(t.tagBench);
      if (rt.features.view)       featureTags.push(t.tagView);
      if (rt.features.night)      featureTags.push(t.tagNight);

      const commentsHtml = rt.comments.length > 0
        ? rt.comments.map(c => {
          const commentText = currentLang === 'en' ? (c.text_en || c.text) : c.text;
          return `
            <div class="comment">
              <div class="comment-meta">
                <span class="comment-author">${c.author}</span>
                <span class="comment-date">${c.date}</span>
              </div>
              <p class="comment-text">${commentText}</p>
            </div>
          `;
        }).join('')
        : `<div class="no-comments">${t.noComments}</div>`;

      document.getElementById('detailBody').innerHTML = `
        <!-- Info Cards -->
        <div class="detail-section">
          <h3>${t.basicInfo}</h3>
          <div class="info-grid">
            <div class="info-card">
              <div class="label">${t.labelFloor}</div>
              <div class="value highlight">${rt.floor}F</div>
            </div>
            <div class="info-card">
              <div class="label">${t.labelHeight}</div>
              <div class="value">${rt.height ? rt.height + 'm' : (currentLang === 'en' ? 'N/A' : '미확인')}</div>
            </div>
            <div class="info-card">
              <div class="label">${t.labelFee}</div>
              <div class="value">${fee || (currentLang === 'en' ? 'Free' : '무료')}</div>
            </div>
            <div class="info-card">
              <div class="label">${t.labelAccess}</div>
              <div class="value" style="font-size:12px;">
                <span class="access-badge ${accessLabel[1]}">${accessLabel[0]}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Hours -->
        <div class="detail-section">
          <h3>${t.hoursTitle}</h3>
          <p style="font-size:15px; color: var(--gray-700);">${hours || (currentLang === 'en' ? 'Daily' : '상시')}</p>
        </div>

        <!-- Tags -->
        <div class="detail-section">
          <h3>${t.featuresTitle}</h3>
          <div class="tags">
            ${featureTags.map(([label, cls]) => `<span class="tag ${cls}">${label}</span>`).join('')}
            ${featureTags.length === 0 ? `<span style="color:var(--gray-400); font-size:14px;">${t.noFeatures}</span>` : ''}
          </div>
        </div>

        <!-- View -->
        <div class="detail-section">
          <h3>${t.viewTitle}</h3>
          ${view
            ? `<div class="view-description">${view}</div>`
            : `<p style="color:var(--gray-400); font-size:14px;">${t.noView}</p>`
          }
        </div>

        <!-- Comments -->
        <div class="detail-section">
          <h3>${t.commentsTitle} (${rt.comments.length})</h3>
          <div class="comment-list">
            ${commentsHtml}
          </div>
          <div class="comment-form" style="margin-top:16px;">
            <div class="comment-input-group">
              <div class="comment-input-row">
                <input type="text" id="commentAuthor" placeholder="${t.commentAuthorPlh}" style="width:120px; flex:none;">
                <input type="text" id="commentText" placeholder="${t.commentTextPlh}" style="flex:1;">
              </div>
              <button class="btn btn-primary" onclick="addComment(${rt.id})" style="align-self: flex-end;">
                ${t.commentSubmit}
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('detailPanel').classList.add('open');

      // Pan map to location
      map.flyTo([rt.lat, rt.lng], 15, { duration: 0.8 });
    }

    function closeDetail() {
      document.getElementById('detailPanel').classList.remove('open');
    }

    // ═══════════════════════════════════════════
    // COMMENTS
    // ═══════════════════════════════════════════

    function addComment(rooftopId) {
      const defaultAnon = currentLang === 'en' ? 'Anonymous' : '익명';
      const author = document.getElementById('commentAuthor').value.trim() || defaultAnon;
      const text = document.getElementById('commentText').value.trim();
      const t = i18n[currentLang];

      if (!text) {
        showToast(t.toastCommentEmpty);
        return;
      }

      const rt = rooftops.find(r => r.id === rooftopId);
      if (!rt) return;

      rt.comments.push({
        id: Date.now(),
        author: author,
        date: new Date().toISOString().split('T')[0],
        text: text,
        text_en: text
      });

      openDetail(rooftopId); // Re-render
      showToast(t.toastCommentSuccess);
    }

    // ═══════════════════════════════════════════
    // REPORT MODAL
    // ═══════════════════════════════════════════

    function openReportModal() {
      document.getElementById('reportModal').classList.add('open');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.remove('open');
    }

    function submitReport() {
      const name = document.getElementById('reportName').value.trim();
      const address = document.getElementById('reportAddress').value.trim();
      const t = i18n[currentLang];

      if (!name || !address) {
        showToast(t.toastReportRequired);
        return;
      }

      const checkedFeatures = [];
      document.querySelectorAll('.checkbox-group input:checked').forEach(cb => {
        checkedFeatures.push(cb.value);
      });

      const report = {
        id: Date.now(),
        name,
        address,
        floor: document.getElementById('reportFloor').value.trim(),
        height: document.getElementById('reportHeight').value.trim(),
        hours: document.getElementById('reportHours').value.trim(),
        access: document.getElementById('reportAccess').value,
        features: checkedFeatures,
        view: document.getElementById('reportView').value.trim(),
        memo: document.getElementById('reportMemo').value.trim(),
        nickname: document.getElementById('reportNickname').value.trim() || (currentLang === 'en' ? 'Anonymous' : '익명'),
        submittedAt: new Date().toISOString(),
        status: 'pending'
      };

      reports.push(report);
      updateStats();

      // Clear form
      document.querySelectorAll('#reportModal input, #reportModal textarea, #reportModal select').forEach(el => {
        if (el.type === 'checkbox') el.checked = false;
        else el.value = '';
      });

      closeReportModal();
      showToast(t.toastReportSuccess);
    }

    // ═══════════════════════════════════════════
    // LANGUAGE SWITCHER
    // ═══════════════════════════════════════════

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('seoul_roof_lang', lang);
      const t = i18n[lang];

      document.title = t.docTitle;
      document.getElementById('appTitle').textContent = t.appTitle;
      document.getElementById('langToggleBtn').textContent = t.langBtn;
      document.getElementById('btnList').textContent = t.btnList;
      document.getElementById('btnReport').textContent = t.btnReport;
      document.getElementById('sidebarTitle').textContent = t.sidebarTitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;

      document.getElementById('chipAll').textContent = t.chipAll;
      document.getElementById('chipGarden').textContent = t.chipGarden;
      document.getElementById('chipCafe').textContent = t.chipCafe;
      document.getElementById('chipNight').textContent = t.chipNight;
      document.getElementById('chipFree').textContent = t.chipFree;
      document.getElementById('chipPublic').textContent = t.chipPublic;

      document.getElementById('statCountLabel').textContent = t.statCountLabel;
      document.getElementById('statReportsLabel').textContent = t.statReportsLabel;

      // Modal elements
      if (document.getElementById('modalTitle')) {
        document.getElementById('modalTitle').textContent = t.reportModalTitle;
        document.getElementById('modalSub').textContent = t.reportModalSubtitle;
        document.getElementById('labelReportName').innerHTML = `${t.reportNameLabel} <span class="required">*</span>`;
        document.getElementById('reportName').placeholder = t.reportNamePlh;
        document.getElementById('labelReportAddr').innerHTML = `${t.reportAddrLabel} <span class="required">*</span>`;
        document.getElementById('reportAddress').placeholder = t.reportAddrPlh;
        document.getElementById('hintReportAddr').textContent = lang === 'en' ? 'Approximate location or landmark is also fine' : '정확한 주소가 어려우면 대략적인 위치도 괜찮습니다';
        document.getElementById('labelReportFloor').innerHTML = `${t.reportFloorLabel} <span class="optional">(${lang === 'en' ? 'optional' : '선택'})</span>`;
        document.getElementById('reportFloor').placeholder = t.reportFloorPlh;
        document.getElementById('labelReportHeight').innerHTML = `${t.reportHeightLabel} <span class="optional">(${lang === 'en' ? 'optional' : '선택'})</span>`;
        document.getElementById('reportHeight').placeholder = t.reportHeightPlh;
        document.getElementById('labelReportHours').innerHTML = `${t.reportHoursLabel} <span class="optional">(${lang === 'en' ? 'optional' : '선택'})</span>`;
        document.getElementById('reportHours').placeholder = t.reportHoursPlh;
        document.getElementById('labelReportAccess').innerHTML = `${t.reportAccessLabel} <span class="optional">(${lang === 'en' ? 'optional' : '선택'})</span>`;
        document.getElementById('labelReportView').innerHTML = `${t.reportViewLabel} <span class="optional">(${lang === 'en' ? 'optional' : '선택'})</span>`;
        document.getElementById('reportView').placeholder = t.reportViewPlh;
        document.getElementById('labelReportMemo').innerHTML = `${t.reportMemoLabel} <span class="optional">(${lang === 'en' ? 'optional' : '선택'})</span>`;
        document.getElementById('reportMemo').placeholder = t.reportMemoPlh;
        document.getElementById('labelReportNick').innerHTML = `${t.reportNickLabel} <span class="optional">(${lang === 'en' ? 'optional' : '선택'})</span>`;
        document.getElementById('reportNickname').placeholder = t.reportNickPlh;
        document.getElementById('btnModalCancel').textContent = t.reportCancel;
        document.getElementById('btnModalSubmit').textContent = t.reportSubmit;
      }

      renderMarkers();
      renderLocationList();

      // If detail panel is open, re-render it
      const detailName = document.getElementById('detailName').textContent;
      if (document.getElementById('detailPanel').classList.contains('open') && detailName) {
        const currentRt = rooftops.find(r => r.name === detailName || r.name_en === detailName);
        if (currentRt) openDetail(currentRt.id);
      }
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'ko' ? 'en' : 'ko');
    }

    // ═══════════════════════════════════════════
    // STATS
    // ═══════════════════════════════════════════

    function updateStats() {
      document.getElementById('statCount').textContent = rooftops.length;
      document.getElementById('statReports').textContent = reports.length;
    }

    // ═══════════════════════════════════════════
    // TOAST
    // ═══════════════════════════════════════════

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ═══════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════

    setLanguage(currentLang);
    updateStats();

    // Close modal on overlay click
    document.getElementById('reportModal').addEventListener('click', function(e) {
      if (e.target === this) closeReportModal();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeReportModal();
        closeDetail();
        document.getElementById('sidebar').classList.remove('open');
      }
    });
  </script>
